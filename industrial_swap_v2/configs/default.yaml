  output_dir: outputs/official
  seed: 42
  gpu: 2
  gsle_python: envs/gsle/bin/python
  sam_python: envs/gsle_langsplat/bin/python
  trellis_python: industrial_swap_v2/envs/trellis2_reused/bin/python
  source_ply: outputs/reconstruction/point_cloud/iteration_30000/point_cloud.ply
  source_sha256: 1d5cc6a5b58e7d99fbefd54ba6de7ab351ee23b884b2fcacba11720906b5bf7a
  records_dir: records/official
  logs_dir: logs/official
m1:
  reuse_existing_localization: true
  localization_dir: outputs/gsle/localization
  target_text: an industrial machine with a black assembly on a white base
m2:
  model: qwen-image-2.1-pro
  provider: qianwen_api
  endpoint: https://maas.qianwenaiapi.com/api/v1/services/aigc/multimodal-generation/generation
  api_key_file: /mnt/sda/ubuntu/lkx/papers/qwen-API.txt
  max_api_requests: 1
  candidates: 1
  output_size: 1024*1024
  timeout_seconds: 600
  prompt_extend: false
  seed: 42
  use_avp: true
  reuse_anchor: true
  existing_anchor: outputs/gsle/avp/anchor.json
  anchor_resolution: 1024
  spatial_conditions:
    method: adaptive_visible_v1
    geometry_quantile: 0.01
    covariance_cap_fraction: 0.04
    space_padding_fraction: 0.025
    floor_snap_fraction: 0.12
    max_height_ratio: 1.65
    min_height_ratio: 0.75
    old_alpha_threshold: 0.02
    edge_fraction: 0.015
    depth_margin_fraction: 0.02
    depth_std_fraction: 0.12
    depth_cdf_bins: 33
    max_front_contribution: 0.15
    protected_contribution: 0.5
  use_scene_depth: true
  use_background_depth: true
  use_sam: true
  replacement_text: A yellow six-axis industrial robotic arm mounted on a square steel
    base, with articulated rotary joints, shoulder, elbow, wrist, and a compact two-finger
    gripper.
m3:
  method: pbr_multiview_gaussian
  input_image: outputs/official/m2/object_rgba.png
  model: microsoft/TRELLIS.2-4B
  repository: https://github.com/microsoft/TRELLIS.2
  revision: 75fbf0183001ed9876c8dbb35de6b68552ee08bd
  pipeline_type: 1024_cascade
  low_vram: true
  minimum_free_gpu_gib: 18
  memory_budget_gib: 16
  gaussian_count: 200000
  opacity: 0.8
  tangent_scale_multiplier: 1.1
  normal_scale_ratio: 0.15
  texture_size: 4096
  decimation_target: 1000000
  fit_fraction: 0.95
  pbr:
    blender: industrial_swap_v2/tools/blender-4.5.4-linux-x64/blender
    hdri: test01/autoshop_01_4k.hdr
    source_glb: null
    render:
      resolution: 512
      samples: 64
      azimuths_degrees: [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330]
      elevations_degrees: [-10, 10, 30]
      hdri_strength: 1.0
      hdri_rotation_degrees: 0.0
      exposure: 0.0
      fov_degrees: 49.1
      camera_margin: 1.12
      compute_device: CUDA
      denoise: true
      max_bounces: 8
    training:
      iterations: 4000
      evaluate_every: 250
      save_every: 1000
      rgb_weight: 1.0
      depth_weight: 0.2
      sh_degree: 3
      sh_dc_lr: 0.0025
      sh_rest_lr: 0.00125
      opacity_lr: 0.01
      scale_lr: 0.003
      xyz_lr_fraction: 0.00001
      max_xyz_offset_fraction: 0.002
      min_scale_ratio: 0.5
      max_scale_ratio: 2.0
      minimum_free_gpu_gib: 10
m4:
  method: dual_mask_local_background
  integration:
    alignment: rasterized_reference
    existing_transform: null
    registration:
      search_resolution: 320
      refine_resolution: 640
      yaw_step_degrees: 15
      refine_candidates: 6
      coarse_steps: 120
      fine_steps: 180
      rgb_weight: 0.18
      center_weight: 0.35
      volume_weight: 8.0
      max_horizontal_fraction: 0.3
  minimum_free_gpu_gib: 24
  save_every: 500
  multiview_supervision:
    enabled: true
    scheme: old_new_union_v2
    resolution: 640
    source_views: 40
    holdout_every: 4
    local_expansion: 0.25
    min_observed_views: 2
    union_edge_fraction: 0.003
  local_background:
    enabled: true
    iterations: 250
    color_lr: 0.004
    opacity_lr: 0.06
    rgb_weight: 1.0
    visibility_weight: 1.0
    opacity_preserve_weight: 0.05
    color_preserve_weight: 0.02
    max_rgb_change: 0.08
    max_opacity_change: 0.08
    warmup_steps: 20
    evaluate_every: 50
render:
  trajectory_width: 960
  orbit_resolution: 512
  orbit_frames: 72
  fps: 12
